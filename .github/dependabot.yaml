version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "nuget"
    directories:
      - "/src/SpaCookieAuth.Api"
      - "/tests/SpaCookieAuth.Api.Tests"
    schedule:
      interval: "weekly"

    open-pull-requests-limit: 0
