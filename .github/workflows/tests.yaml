name: tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: .NET API validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Verify .NET toolchain
        run: dotnet --info

      - name: Restore dependencies
        run: dotnet restore SpaCookieAuth.slnx

      - name: Check formatting
        run: dotnet format SpaCookieAuth.slnx --verify-no-changes --no-restore

      - name: Build application
        run: dotnet build SpaCookieAuth.slnx --configuration Release --no-restore --warnaserror

      - name: Run tests
        run: dotnet test SpaCookieAuth.slnx --configuration Release --no-build --no-restore
